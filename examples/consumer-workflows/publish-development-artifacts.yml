name: Generate Development Artifacts

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful validation workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish-development:
    uses: synapptech-devops/pipelines/.github/workflows/publish-development-artifacts.yml@v1
    with:
      pipeline_ref: v1
      source_run_id: ${{ inputs.source_run_id }}
    secrets:
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
